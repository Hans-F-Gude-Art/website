    - "Hans F. Gude is the Official Cal Licensed Artist,&nbsp;a title he has held since October 2017 owing to the quality and unique vision of his artworks of the UC Berkeley campus. &nbsp;"
    - "His &nbsp;vision is a product of his artistic perception and training combined with his in-depth knowledge of the campus.&nbsp; A UC Berkeley graduate (BA, Philosophy), he also worked on the campus staff for more than eight years. &nbsp;"
    - "Hans has produced images of the campus in pencil, pen &amp; ink, watercolor, oil paint, and gouache."
    - "Reproductions of Hans&#39;s Berkeley artwork are available at:"
    - "Bancroft Way, Berkeley"
