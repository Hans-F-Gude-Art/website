# Site settings
title: HFGudeArt | Hans F. Gude Fine Art & Illustration
description: "Fine art and illustration. Official Cal (UC Berkeley) Licensed Artist, authorized to affix the University's logos to his images of the UC Berkeley campus and Cal Athletics. Subjects include landscapes, still lifes, portraits, figures, athletics. Preferred mediums include oil paint, pen & ink, gouache, watercolor, charc"
keywords: "gudeart, Gude Art, Hans Gude, Hans F. Gude, Hans Gude Art"

# The base hostname & protocol for your site.
url: "https://hfgude.com"

# The subpath of your site, e.g. /blog
baseurl: ""

# Default social media image
image: /assets/images/logo_on_white.png

# Build settings
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-sitemap

# WebP copies served through srcset (_plugins/src/infrastructure/image_derivatives.rb).
# 300, 600, and 900 cover a ~300px grid thumbnail at 1x, 2x, and 3x; 1200,
# 1600, and 2400 cover the artwork page up to 1600 CSS px. Each `sizes` is
# the image's slot on its own page; grid templates state their own sizes.
image_derivatives:
  - front_matter: artworks
    widths: [300, 600, 900, 1200, 1600, 2400]
    sizes: "min(100vw - 50px, 1600px)"
  - source_dir: assets/images/bio
    widths: [300, 600, 900]
    sizes: "(max-width: 37.4375em) calc(100vw - 50px), 392px"

# Collections
collections:
  artworks:
    output: true
    permalink: /artwork/:name/

# Excluded files from site
exclude:
  - .venv/
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - Makefile
  - README.md
  - Rakefile
  - _scripts
  - _coverage
  - redirects.json
  - vendor
