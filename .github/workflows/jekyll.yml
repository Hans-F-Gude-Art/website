# .github/workflows/jekyll.yml
name: Build and Deploy Jekyll site to Pages

on:
  # Runs on pushes to ANY branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate gallery data
        run: python3 _scripts/validate_galleries.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # ImageDerivatives encodes WebP artwork copies with ImageMagick.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # The cache key hashes every JPEG and PNG under assets/images/ (artwork
      # and bio images), the generator, and _config.yml, which sets the
      # widths, so only new or changed images are encoded. A full miss
      # encodes about 2,300 copies and adds about ten minutes on 4 cores.
      # Artwork text is not in the key, so editing an artwork's title does
      # not save a new cache. An exact key hit never saves, so every input
      # that changes the outputs must be in the key. ImageDerivatives rejects
      # uppercase extensions, which these case-sensitive globs would miss.
      - name: Restore image derivative cache
        uses: actions/cache@v6
        with:
          path: .jekyll-cache/image-derivatives
          key: image-derivatives-${{ hashFiles('assets/images/**/*.jpg', 'assets/images/**/*.jpeg', 'assets/images/**/*.png', '_plugins/**/image_derivatives.rb', '_config.yml') }}
          restore-keys: image-derivatives-

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run script tests
        working-directory: _scripts
        run: uv run --group dev pytest -q

      # Measures image slots in headless Chromium (`make check-images`).
      - name: Check image sizes and lazy LCP
        working-directory: _scripts
        run: |
          uv run --group browser playwright install --with-deps --only-shell chromium
          uv run --group browser python ci/check_image_sizes.py ../_site --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        # Only upload if we are on main (where deployment happens)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # This matches the condition above, ensuring we only try to deploy if we uploaded
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
