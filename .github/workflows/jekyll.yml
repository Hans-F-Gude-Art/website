# .github/workflows/jekyll.yml
name: Build and Deploy Jekyll site to Pages

on:
  # Runs on pushes to ANY branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time per branch. GitHub keeps one pending run per group and
# cancels the older pending one, so a shared group would let a push to any
# branch cancel main's queued deploy. Only main deploys, so one deploy at a
# time still holds. In-progress runs finish rather than leave a half deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate gallery data
        run: python3 _scripts/validate_galleries.py --check-tags

      # The script tests need no build, so they run before the slow Jekyll
      # build and a failure shows up in seconds.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run script tests
        working-directory: _scripts
        run: uv run --group dev pytest -q

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # ImageDerivatives encodes WebP artwork copies with ImageMagick.
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # The image_derivatives entries of _config.yml without `sizes` (the
      # sources and widths, the only settings that change the encoded files)
      # and the ImageMagick and libwebp versions. Hashing the entries instead
      # of the whole file keeps an unrelated config edit (the site title)
      # from saving another full copy of the cache. The encoder versions are
      # in ImageDerivatives' own key, so a runner image upgrade re-encodes;
      # they must be here too, or the re-encoded cache would never be saved.
      - name: Hash image derivative settings
        id: derivative-settings
        run: |
          settings=$(ruby -ryaml -rjson -e 'puts JSON.generate(Array(YAML.safe_load_file("_config.yml")["image_derivatives"]).map { |entry| entry.reject { |key, _| key == "sizes" } })')
          encoder="$(convert -version | head -n 1) $(convert -list format | grep -m 1 -E '^ *WEBP')"
          echo "hash=$(printf '%s\n%s' "$settings" "$encoder" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The cache key hashes every JPEG and PNG under assets/images/ (artwork
      # and bio images), the generator and its sRGB profile, and the
      # derivative settings and encoder versions, so only new or changed
      # images are encoded. A full miss encodes about 2,300 copies and adds
      # about ten minutes on 4 cores.
      # Artwork text is not in the key, so editing an artwork's title does
      # not save a new cache. An exact key hit never saves, so every input
      # that changes the outputs must be in the key. ImageDerivatives rejects
      # uppercase extensions, which these case-sensitive globs would miss.
      - name: Restore image derivative cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jekyll-cache/image-derivatives
          key: image-derivatives-${{ steps.derivative-settings.outputs.hash }}-${{ hashFiles('assets/images/**/*.jpg', 'assets/images/**/*.jpeg', 'assets/images/**/*.png', '_plugins/**/image_derivatives.rb', '_plugins/**/sRGB.icc') }}
          restore-keys: image-derivatives-

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check links, images, and heading outline
        run: bundle exec ruby _bin/check_links.rb

      # The Chromium download is keyed on uv.lock, which pins Playwright and
      # so the browser build. `--with-deps` still installs the system
      # libraries with apt, which a cache cannot restore.
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('_scripts/uv.lock') }}

      # Measures image slots in headless Chromium (`make check-images`).
      - name: Check image sizes and lazy LCP
        working-directory: _scripts
        run: |
          uv run --group browser playwright install --with-deps --only-shell chromium
          uv run --group browser python ci/check_image_sizes.py ../_site --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        # Only upload if we are on main (where deployment happens)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # This matches the condition above, ensuring we only try to deploy if we uploaded
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
